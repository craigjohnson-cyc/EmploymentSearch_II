<div id="positions-grid">
    <table class="table table-sm table-striped table-bordered">
        <thead>
            <tr>
                <th>Job Title</th>
                <th>Role</th>
                <th>Pay Rate</th>
                <th>Application Date</th>
                <th>Last Contact Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for pos in positions %}
            <tr>
                <td>{{ pos.position }}</td>
                <td>{{ pos.note }}</td>
                <td>{{ pos.rate }}</td>
                <td>{{ pos.applicationdate }}</td>
                <td>{{ pos.lastcontactdate }}</td>
                <td>{{ pos.status }}</td>
                <td>
                    <a class="btn btn-sm btn-outline-primary" href="{% url 'position_update' pos.position_key %}">Edit</a>
                    <a class="btn btn-sm btn-outline-danger" href="{% url 'position_rejected' pos.position_key %}">Rejected</a>
                    <a class="btn btn-sm btn-outline-danger" href="{% url 'position_closed' pos.position_key %}">Closed</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="7">No positions.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
