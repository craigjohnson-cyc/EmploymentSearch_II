<table class="table table-sm table-striped table-bordered">
    <thead>
        <tr>
            <th>Job Title</th>
            <th>Role</th>
            <th>Pay Rate</th>
            <th>Application Date</th>
            <th>Last Contact Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for pos in positions %}
        <tr>
            <td>{{ pos.position }}</td>
            <td>{{ pos.note }}</td>
            <td>{{ pos.rate }}</td>
            <td>{{ pos.applicationdate }}</td>
            <td>{{ pos.lastcontactdate }}</td>
            <td>{{ pos.status }}</td>
            <td>
                <a class="btn btn-sm btn-outline-primary" href="{% url 'position_update' pos.position_key %}">Edit</a>
                <a class="btn btn-sm btn-outline-danger" href="{% url 'position_rejected' pos.position_key %}">Rejected</a>
                <a class="btn btn-sm btn-outline-danger" href="{% url 'position_closed' pos.position_key %}">Closed</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No positions.</td></tr>
        {% endfor %}
    </tbody>
</table>

<script>
    // CSRF helper to read the csrftoken cookie
    function getCookie(name) {
        const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
        return match ? match.pop() : '';
    }

    async function postAction(url) {
        const resp = await fetch(url, {
            method: 'POST',
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': getCookie('csrftoken')
            }
        });
        if (resp.redirected) {
            window.location.href = resp.url;
            return;
        }
        if (resp.ok) {
            // simple approach: reload to reflect change
            window.location.reload();
            return;
        }
        // fallback: show error
        alert('Action failed: ' + resp.status);
    }

    // delegate clicks on reject/close links to send POST
    document.addEventListener('click', function (e) {
        const a = e.target.closest('a');
        if (!a) return;
        const href = a.getAttribute('href');
        if (!href) return;
        if (href.includes('/positions/reject/') || href.includes('/positions/close/')) {
            e.preventDefault();
            postAction(href);
        }
    });
</script>

<script>
    document.getElementById('positionAdd').addEventListener('click', function () {
        const companyKey = this.dataset.companyKey;
        window.location.href = "{% url 'position_create' %}?company_key=" + encodeURIComponent(companyKey);
    });
</script>
