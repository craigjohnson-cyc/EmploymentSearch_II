{% for field in form %}
<div class="mb-3">
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
    {{ field }}
    {% if field.errors %}
    <div class="invalid-feedback d-block">
        {% for error in field.errors %}
        {{ error }}
        {% endfor %}
    </div>
    {% endif %}
</div>
{% endfor %}




<div class="form-group row">
    <div class="col-sm-8 offset-sm-4">
        <button id="companySave" type="submit" class="btn btn-primary">Save Company Data</button>
        <a class="btn btn-secondary" href="{% url 'company_list' %}">Exit</a>
    </div>
</div>
